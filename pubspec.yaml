name: still
description: A local-first video and image player for the desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Playback (libmpv on desktop, hardware decoding included).
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Persistence.
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Platform integration.
  path_provider: ^2.1.6
  file_selector: ^1.1.0

  # Local processing.
  image: ^4.13.1
  exif: ^3.3.0

  # Utilities.
  path: ^1.9.1
  collection: ^1.19.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
