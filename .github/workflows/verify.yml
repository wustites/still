name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

  windows:
    name: build windows (release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Scaffold Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name still --org dev.still .flutter_scaffold
          if (-not (Test-Path windows)) {
            Copy-Item -Recurse -Force .flutter_scaffold/windows .
          }
          if (-not (Test-Path .metadata)) {
            Copy-Item -Force .flutter_scaffold/.metadata .
          }
          Remove-Item -Recurse -Force .flutter_scaffold

      - name: Dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build windows --release

      - name: Bundle MSVC runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found.' }
          $redist = Join-Path $installation 'VC/Redist/MSVC'
          $runtime = Get-ChildItem -LiteralPath $redist -Directory |
            Where-Object Name -Match '^\d+(\.\d+)+$' |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object {
              Get-ChildItem -Path (Join-Path $_.FullName 'x64/Microsoft.VC*.CRT/vcruntime140.dll') -File -ErrorAction SilentlyContinue
            } | Select-Object -First 1
          if (!$runtime) { throw 'The redistributable x64 MSVC runtime was not found.' }
          Copy-Item -Path (Join-Path $runtime.DirectoryName '*.dll') -Destination 'build/windows/x64/runner/Release'

      - name: Replace bundled debug zlib
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          $packages = Join-Path $env:RUNNER_TEMP 'still-vcpkg'
          & $vcpkg install zlib:x64-windows --classic "--x-install-root=$packages"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build release zlib.' }
          $zlib = Get-ChildItem -LiteralPath (Join-Path $packages 'x64-windows/bin') -File |
            Where-Object Name -Match '^zlib1?\.dll$' |
            Select-Object -First 1
          if (!$zlib) { throw 'The release zlib DLL was not found.' }
          Copy-Item -LiteralPath $zlib.FullName -Destination 'build/windows/x64/runner/Release/zlib.dll' -Force
          Copy-Item -LiteralPath (Join-Path $packages 'x64-windows/share/zlib/copyright') -Destination 'build/windows/x64/runner/Release/zlib-LICENSE.txt'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: still-windows-x64-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
